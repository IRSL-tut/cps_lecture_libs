<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebHost</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      width: 100%;
      height: 100%;
      display: flex;
    }

    #canvas-container {
      width: 50%;
      height: 600px;
      margin-bottom: 5px;
      margin-right: 5px;
      border: 1px solid black;
      display: flex;
      flex-direction: column;
    }

    #host-config {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 6px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #host-config input[type="text"],
    #host-config input[type="number"] {
      width: 140px;
    }

    #host-config .narrow-input {
      width: 90px;
    }

    #ssl-wrapper {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    #right-side {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    #button-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-gap: 10px;
      margin-right: 10px;
    }

    .button {
      width: auto;
      margin-bottom: 5px;
      margin-left: 5px;
      text-align: center;
      border: 1px solid black;
    }

    .input-area {
      width: 85%;
      margin-left: 10px;
    }

    #textarea {
      width: 98%;
      height: 98%;
      margin-top: 10px;
      margin-bottom: 5px;
      margin-right: 10px;
    }
  </style>
  <script src="./libs/message_pool.js"> </script>
</head>
<body>
  <div id="canvas-container">
  </div>

  <div id="right-side">
    <div id="host-config">
      <label for="ws-host">host</label>
      <input id="ws-host" type="text" value="localhost" placeholder="192.168.0.199">
      <label for="ws-port">port</label>
      <input id="ws-port" class="narrow-input" type="number" value="5001" min="1" max="65535" placeholder="8000">
      <label id="ssl-wrapper" for="ws-ssl">
        <input id="ws-ssl" type="checkbox">
        <span>ssl</span>
      </label>
    </div>

    <div id="button-container">
      <button class="button" onclick="startClient(getSelectedClientProgram(), getSelectedClientMode())">Start Client</button>
      <div>
        <input id="client-program" class="input-area" list="client-program-list" placeholder="Load program (optional)" />
        <datalist id="client-program-list">
          <option value="./samples/prog/function.xml"></option>
          <option value="./samples/prog/janken.xml"></option>
          <option value="./samples/prog/loop.xml"></option>
          <option value="./samples/prog/sample_if.xml"></option>
          <option value="./samples/prog/stone_game.xml"></option>
          <option value="./samples/prog/variable.xml"></option>
          <option value="./samples/pubsub/action_client.xml"></option>
          <option value="./samples/pubsub/action_server.xml"></option>
          <option value="./samples/pubsub/callback_get_mouse_message.xml"></option>
          <option value="./samples/pubsub/callback_sensor_device_feedback.xml"></option>
          <option value="./samples/pubsub/get_mouse_message.xml"></option>
          <option value="./samples/pubsub/sample_callback_pubsub.xml"></option>
          <option value="./samples/pubsub/sample_callback.xml"></option>
          <option value="./samples/pubsub/send_canvas_message.xml"></option>
          <option value="./samples/pubsub/sensor_device_feedback.xml"></option>
          <option value="./samples/pubsub/subscribe_echo.xml"></option>
          <option value="./samples/pubsub/subscribe_publish.xml"></option>
          <option value="./samples/devices/use_joy.xml"></option>
        </datalist>
        <select id="client-mode" class="input-area" aria-label="Select client mode">
          <option value="program" selected>Mode: program</option>
          <option value="plot">Mode: plot</option>
          <option value="notes">Mode: notes</option>
        </select>
      </div>
      <button class="button" onclick="checkClientList()">Check Clients</button> <div><!-- dummy element --></div>
      <div><br><!-- dummy element --></div><div><!-- dummy element --></div>
      <button class="button" onclick="startMsgGui()">Start Message GUI</button> <div><!-- dummy element --></div>
      <div><br><!-- dummy element --></div><div><!-- dummy element --></div>
      <button class="button" onclick="startMouse()">Start Mouse Sensor</button> <div><!-- dummy element --></div>
      <button class="button" onclick="startCanvas()">Start Canvas Device</button> <div><!-- dummy element --></div>
      <div><br><!-- dummy element --></div><div><!-- dummy element --></div>
      <button class="button" onclick="startJoy()">Start Virtual Joy</button> <div><!-- dummy element --></div>
      <button class="button" onclick="startSound()">Start Sound</button> <div><!-- dummy element --></div>
      <button class="button" onclick="startVibration()">Start Vibration</button> <div><!-- dummy element --></div>
      <button class="button" onclick="startSensors()">Start Sensors</button> <div><!-- dummy element --></div>
      <div><br><!-- dummy element --></div><div><!-- dummy element --></div>
      <button class="button" onclick="startObstacles()">Start Obstacles Environment</button> <div><!-- dummy element --></div>
      <button class="button" onclick="startMaze()">Start Maze Environment</button> <div><!-- dummy element --></div>
    </div>
    <textarea id="textarea"></textarea>
  </div>

  <script>
    const myGlobal = {};
    myGlobal.debug = false;
    myGlobal.clientCount = 0;
    myGlobal.messageCount = 0;
    myGlobal.clients = new Map();
    myGlobal.textarea = document.getElementById("textarea");
    myGlobal.echoback = true;
    myGlobal.print = (msg) =>  {
      console.log(msg);
      myGlobal.textarea.value += '\n' + msg;
    };
    myGlobal.textarea.oninput = (ev) => {
      if (ev.inputType == 'insertLineBreak') {
        try {
          eval(myGlobal.textarea.value);
        } catch (e) {
          aleart(e);
        }
      }
    };
    myGlobal.mp = new MessagePool(10);
    myGlobal.mp.auto_subscribe = true;

    function updateClientList() {
      {
        const tmp = document.getElementById("client-table");
        if (tmp) {
          tmp.remove();
        }
      }
      const tbl = document.createElement("table");
      const tblBody = document.createElement("tbody");
      tbl.id = 'client-table';

      let cntr = 1;
      myGlobal.clients.forEach((value, key) => {
        const row = document.createElement("tr");
        {
          const cell = document.createElement("td");
          const cellText = document.createTextNode(String(cntr));
          cell.appendChild(cellText);
          row.appendChild(cell);
        }
        {
          const cell = document.createElement("td");
          const cellText = document.createTextNode(key);
          cell.appendChild(cellText);
          row.appendChild(cell);
        }
        tblBody.appendChild(row);
        cntr += 1;
      });
      tbl.appendChild(tblBody);
      {
        const tmp = document.getElementById("canvas-container");
        tmp.appendChild(tbl);
      }
      tbl.setAttribute("border", "2");
    }

    function checkClientList() {
      const lst = [];
      myGlobal.clients.forEach((value, key) => {
        if (value.closed) {
          lst.push(key);
        }
      });
      lst.forEach((key) => {
        myGlobal.clients.delete(key);
      });
      updateClientList();
    }

    function sendMessageToClients(msg, source = undefined) {
      var closed = false;
      myGlobal.clients.forEach((value) => {
        if (value.closed) {
          closed = true;
        } else {
          if (value != source) {
            value.postMessage(msg, "*");
          }
        }
      });
      if (closed) {
        checkClientList();
      }
    }

    function getSelectedClientProgram() {
      const input = document.getElementById("client-program");
      if (!input) {
        return "";
      }

      return String(input.value || "").trim();
    }

    function getSelectedClientMode() {
      const input = document.getElementById("client-mode");
      if (!input) {
        return "program";
      }

      return String(input.value || "program").trim();
    }

    function getConfiguredHost() {
      const input = document.getElementById("ws-host");
      return String((input && input.value) || "").trim();
    }

    function getConfiguredPort() {
      const input = document.getElementById("ws-port");
      return String((input && input.value) || "").trim();
    }

    function getConfiguredSsl() {
      const input = document.getElementById("ws-ssl");
      return Boolean(input && input.checked);
    }

    function buildHostedClientUrl(pathName, searchParams = {}) {
      const clientUrl = new URL(pathName, window.location.href);
      Object.entries(searchParams).forEach(([key, value]) => {
        if (value) {
          clientUrl.searchParams.set(key, value);
        }
      });
      clientUrl.searchParams.set("host", getConfiguredHost() || "localhost");
      clientUrl.searchParams.set("port", getConfiguredPort() || "5001");
      clientUrl.searchParams.set("ssl", getConfiguredSsl() ? "1" : "0");
      return clientUrl.toString();
    }

    function openClientWindow(pathName, tabname, features, searchParams = {}) {
      const targetUrl = buildHostedClientUrl(pathName, searchParams);
      const newWindow = window.open(targetUrl, tabname, features);
      myGlobal.clients.set(tabname, newWindow);
      myGlobal.clientCount += 1;
      updateClientList();
    }

    function startClient(programUrl = "", modeName = "program") {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Client:' + len;
      openClientWindow("./prog_client.html", tabname, undefined, {
        prog: programUrl,
        mode: modeName,
      });
    }

    function startMouse() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Mouse:' + len;
      openClientWindow(
        "./devices/mouse_sensor_client.html",
        tabname,
        "top=90,left=90,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startCanvas() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Canvas:' + len;
      openClientWindow(
        "./devices/canvas_device_client.html",
        tabname,
        "top=70,left=70,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startMsgGui() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Device:' + len;
      openClientWindow(
        "./msg_gui_client.html",
        tabname,
        "top=50,left=50,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startJoy() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Joy:' + len;
      openClientWindow(
        "./devices/virtual_joy.html",
        tabname,
        "top=50,left=50,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startSound() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Sound' + len;
      openClientWindow(
        "./devices/sound.html",
        tabname,
        "top=50,left=50,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startVibration() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Vibration:' + len;
      openClientWindow(
        "./devices/vibration.html",
        tabname,
        "top=50,left=50,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function startSensors() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Sensors:' + len;
      openClientWindow(
        "./devices/sensor-api.html",
        tabname,
        "top=50,left=50,width=740,height=740,menubar=no,toolbar=no,location=no"
      );
    }

    function getEnvironmentWindowFeatures() {
      const popupWidth = Math.max(480, Math.floor(window.outerWidth * 2 / 3));
      const popupHeight = Math.max(360, Math.floor(window.outerHeight * 2 / 3));
      const popupLeft = Math.max(0, window.screenX + Math.floor((window.outerWidth - popupWidth) / 2));
      const popupTop = Math.max(0, window.screenY + Math.floor((window.outerHeight - popupHeight) / 2));

      return `top=${popupTop},left=${popupLeft},width=${popupWidth},height=${popupHeight},menubar=no,toolbar=no,location=no,resizable=yes,scrollbars=no`;
    }

    function startObstacles() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Obstacles(env):' + len;
      openClientWindow(
        "./environments/env_obstacles.html",
        tabname,
        getEnvironmentWindowFeatures()
      );
    }

    function startMaze() {
      checkClientList();
      var len = myGlobal.clientCount;
      var tabname = 'Maze(env):' + len;
      openClientWindow(
        "./environments/env_maze.html",
        tabname,
        getEnvironmentWindowFeatures()
      );
    }

    window.addEventListener("message",
      (ev) => {
        myGlobal.messageCount += 1;
        if (myGlobal.debug) {
          console.log('msg:' + ev.data);
          console.log(ev.origin);
          console.log(ev.source);
        }
        myGlobal.mp._receiveData(ev.data);
        if (myGlobal.echoback) {
          sendMessageToClients(ev.data, null);
        } else {
          sendMessageToClients(ev.data, ev.source);
        }
      }, false);
  </script>
</body>
</html>
